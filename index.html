  }
  .meta b { color: var(--ink); font-weight: 600; }
  .dl {
    display: inline-block;
    margin-top: 32px;
    padding: 14px 48px;
    border: 1px solid var(--ink);
    border-radius: 50px;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }
  .dl:active { background: var(--ink); color: var(--paper); }
  .note {
    margin-top: 32px;
