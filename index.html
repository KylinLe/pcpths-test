<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普中摄影社 · 测试版下载</title>
<style>
  :root {
    --bg: #030806;
    --panel: rgba(0, 20, 14, .72);
    --green: #00ff9d;
    --green-dim: rgba(0, 255, 157, .35);
    --cyan: #00e5ff;
    --amber: #ffb300;
    --text: #b8ffde;
    --dim: rgba(0, 255, 157, .5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "SF Mono", "Cascadia Mono", Menlo, Consolas, "PingFang SC", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 18px;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
  }

  /* 赛博网格背景 */
  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(rgba(0, 255, 157, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 157, .06) 1px, transparent 1px),
      radial-gradient(ellipse at 50% 0%, rgba(0, 255, 157, .10), transparent 60%),
      var(--bg);
    background-size: 34px 34px, 34px 34px, 100% 100%, 100% 100%;
  }

  /* CRT 扫描线 */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, .16) 0px, rgba(0, 0, 0, .16) 1px,
      transparent 1px, transparent 3px
    );
    animation: crt-flicker 6s steps(60) infinite;
  }
  @keyframes crt-flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: .6; }
    94% { opacity: 1; }
    97% { opacity: .8; }
    98% { opacity: 1; }
  }

  .panel {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--green-dim);
    box-shadow: 0 0 24px rgba(0, 255, 157, .12), inset 0 0 40px rgba(0, 255, 157, .04);
    padding: 40px 26px 30px;
  }

  /* 四角 HUD 括号 */
  .panel::before, .panel::after,
  .corner::before, .corner::after {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    border: 2px solid var(--green);
    pointer-events: none;
  }
  .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .panel::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .corner::before { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .corner::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  /* 顶部状态行 */
  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 26px;
  }
  .status .online { color: var(--green); }
  .status .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: blink 1.2s step-end infinite;
  }
  @keyframes blink { 50% { opacity: .15; } }

  /* 故障字标题 */
  .glitch {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--green);
    text-align: center;
    position: relative;
    text-shadow: 0 0 12px rgba(0, 255, 157, .55);
    animation: glitch 3.2s infinite;
  }
  @keyframes glitch {
    0%, 86%, 100% { transform: translate(0); text-shadow: 0 0 12px rgba(0, 255, 157, .55); }
    87% { transform: translate(-2px, 1px); text-shadow: -3px 0 var(--cyan), 3px 0 var(--amber); }
    89% { transform: translate(2px, -1px); text-shadow: 3px 0 var(--cyan), -3px 0 var(--amber); }
    91% { transform: translate(0); text-shadow: 0 0 12px rgba(0, 255, 157, .55); }
    95% { transform: translate(1px, 0); text-shadow: -2px 0 var(--cyan), 2px 0 var(--amber); }
    96% { transform: translate(0); }
  }

  .sub {
    text-align: center;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--dim);
    margin-top: 12px;
    text-transform: uppercase;
  }

  /* 终端读数区 */
  .readout {
    margin-top: 30px;
    border-top: 1px dashed var(--green-dim);
    border-bottom: 1px dashed var(--green-dim);
    padding: 16px 4px;
    font-size: 12px;
    line-height: 2.1;
    letter-spacing: 1px;
    color: var(--dim);
  }
  .readout .k { color: var(--cyan); }
  .readout .v { color: var(--green); }
  .readout .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--green);
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }

  /* 下载按钮 */
  .dl {
    display: block;
    margin-top: 30px;
    padding: 16px 12px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--green);
    text-decoration: none;
    border: 1px solid var(--green);
    background: rgba(0, 255, 157, .07);
    box-shadow: 0 0 18px rgba(0, 255, 157, .22), inset 0 0 18px rgba(0, 255, 157, .06);
    transition: background .12s, box-shadow .12s;
    animation: dl-pulse 2.4s ease-in-out infinite;
  }
  @keyframes dl-pulse {
    0%, 100% { box-shadow: 0 0 18px rgba(0, 255, 157, .22), inset 0 0 18px rgba(0, 255, 157, .06); }
    50% { box-shadow: 0 0 34px rgba(0, 255, 157, .45), inset 0 0 24px rgba(0, 255, 157, .12); }
  }
  .dl:active { background: var(--green); color: var(--bg); }

  .foot {
    margin-top: 28px;
    font-size: 10px;
    letter-spacing: 1px;
    line-height: 2.1;
    color: var(--dim);
    text-align: center;
  }
  .foot .warn { color: var(--amber); }

  /* 底部装饰条 */
  .hex {
    margin-top: 22px;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(0, 255, 157, .28);
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
  }
</style>
</head>
<body>

  </div>
</body>
</html>
